name: AI Security Remediation

on: 
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  security-remediation:
    runs-on: self-hosted
    env:
      # PASTE YOUR ACTUAL NEW TOKEN HERE
      GITHUB_TOKEN: "ghp_REPLACE_WITH_YOUR_ACTUAL_NEW_TOKEN" 
      OLLAMA_MODEL: "qwen2.5-coder:3b"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Semgrep Scan
        run: |
          pip install semgrep || pip install semgrep --break-system-packages
          semgrep --config auto --json --output semgrep-results.json . || true

      - name: Start Ollama
        run: |
          pkill ollama || true
          sleep 2
          ollama serve &
          sleep 5
          ollama pull $OLLAMA_MODEL

      - name: AI Remediation & Push
        run: |
          set +e
          if [ ! -f semgrep-results.json ]; then exit 0; fi

          # Deduplicate findings
          python3 << 'PYEOF'
          import json, os
          os.makedirs('/tmp/findings', exist_ok=True)
          with open('semgrep-results.json') as f:
              data = json.load(f)
          results = data.get('results', [])
          seen = set()
          count = 0
          for r in results:
              file_path = r.get('path', '')
              start_line = r.get('start', {}).get('line', 0)
              key = f"{file_path}:{start_line}"
              if key in seen: continue
              seen.add(key)
              with open(f'/tmp/findings/f_{count}.meta', 'w') as m:
                  json.dump({'file': file_path, 'start': start_line, 'end': r.get('end', {}).get('line', 0), 'rule': r.get('check_id', '').split('.')[-1], 'lines': r.get('extra', {}).get('lines', '')}, m)
              count += 1
          PYEOF

          git config user.name "AI Security Bot"
          git config user.email "security-bot@automated.fix"

          # PROCESS FINDINGS
          for META in /tmp/findings/f_*.meta; do
            [ -f "$META" ] || continue
            FILE=$(python3 -c "import json; print(json.load(open('$META'))['file'])")
            RULE=$(python3 -c "import json; print(json.load(open('$META'))['rule'])")
            LINES=$(python3 -c "import json; print(json.load(open('$META'))['lines'])")
            BRANCH_NAME="fix/sast-${RULE}-$(date +%s)"
            
            git checkout main
            git checkout -b "$BRANCH_NAME"

            # Call Ollama
            curl -s -X POST http://localhost:11434/api/chat -H "Content-Type: application/json" \
              -d "{\"model\":\"$OLLAMA_MODEL\",\"messages\":[{\"role\":\"system\",\"content\":\"Fix this vulnerability. Return ONLY code. No markdown.\"},{\"role\":\"user\",\"content\":\"$LINES\"}],\"stream\":false}" \
              | python3 -c "import sys, json; print(json.load(sys.stdin).get('message', {}).get('content', '').strip())" > /tmp/ai_fix.txt

            export CURRENT_META="$META"
            export FIXED_CODE_FILE="/tmp/ai_fix.txt"

            python3 << 'PYEOF'
          import json, os
          with open(os.environ['CURRENT_META']) as f: m = json.load(f)
          with open(os.environ['FIXED_CODE_FILE']) as f: fixed_code = f.read().replace('```python', '').replace('```', '').strip()
          with open(m['file']) as f: lines = f.readlines()
          new_lines = lines[:m['start']-1] + [fixed_code + '\n'] + lines[m['end']:]
          with open(m['file'], 'w') as f: f.writelines(new_lines)
          PYEOF

            # THE CRITICAL PUSH FIX
            git add "$FILE"
            if git commit -m "fix: resolve $RULE"; then
               # Force authentication by using the token in the URL directly here
               git push "https://x-access-token:${GITHUB_TOKEN}@github.com/Mukul9090/SAST-Code-Fix.git" "$BRANCH_NAME" --force
               
               # Create PR
               curl -s -X POST \
                -H "Authorization: token ${GITHUB_TOKEN}" \
                -H "Accept: application/vnd.github.v3+json" \
                https://api.github.com/repos/Mukul9090/SAST-Code-Fix/pulls \
                -d "{\"title\":\"🔒 AI Fix: $RULE\",\"head\":\"$BRANCH_NAME\",\"base\":\"main\",\"body\":\"Automated fix.\"}"
            fi
            git checkout main
          done
