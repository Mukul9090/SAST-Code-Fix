name: Token Permission Check

on: workflow_dispatch
 
jobs:
  check-token:
    runs-on: self-hosted
    env:
      # Replace this with your actual PAT for the test
      MY_TOKEN: "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"
    steps:
      - name: Query GitHub API for Token Scopes
        run: |
          echo "════════════════════════════════════════════════"
          echo "   TOKEN DIAGNOSTIC REPORT"
          echo "════════════════════════════════════════════════"
          
          # Call the API and capture headers to see scopes
          RESPONSE=$(curl -sI -H "Authorization: token $MY_TOKEN" https://api.github.com/user)
          
          # Check if the token is even valid
          HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP/" | awk '{print $2}')
          
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "✘ ERROR: Token is INVALID or EXPIRED (Status: $HTTP_STATUS)"
            exit 1
          fi

          # Extract the X-OAuth-Scopes header
          SCOPES=$(echo "$RESPONSE" | grep -i "x-oauth-scopes" | cut -d':' -f2 | xargs)
          
          echo "✔ Token is VALID"
          echo "▸ Active Scopes: [ $SCOPES ]"
          echo ""

          if [[ $SCOPES == *"repo"* ]]; then
            echo "✔ PERMISSION CHECK: 'repo' scope found. You HAVE push access."
          else
            echo "✘ PERMISSION CHECK: 'repo' scope MISSING. You cannot push code."
          fi
          echo "════════════════════════════════════════════════"
