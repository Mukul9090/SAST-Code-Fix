name: AI Security Remediation

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ── Run Semgrep SAST Scan ────────────────────────────
      - name: Run Semgrep SAST
        uses: returntocorp/semgrep-action@v1
        with:
          config: auto
        continue-on-error: true

      - name: Run Semgrep JSON output
        run: |
          pip install semgrep
          semgrep --config auto --json --output semgrep-results.json . || true
          echo "✔ Semgrep scan complete"

      - name: Upload scan results
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-results
          path: semgrep-results.json

  ai-remediation:
    runs-on: ubuntu-latest
    needs: security-scan
    steps:
      - uses: actions/checkout@v4

      - name: Download scan results
        uses: actions/download-artifact@v4
        with:
          name: semgrep-results

      # ── Install & Start Ollama ───────────────────────────
      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          echo "✔ Ollama installed"

      - name: Start Ollama & Pull Model
        run: |
          ollama serve &
          sleep 5

          # Wait for server to be ready
          for i in $(seq 1 30); do
            curl -s http://localhost:11434/api/tags > /dev/null 2>&1 && break
            [ "$i" = "30" ] && echo "✘ Ollama failed to start" && exit 1
            sleep 1
          done
          echo "✔ Ollama server ready"

          # Pull the model
          ollama pull gemma4:e2b
          echo "✔ Model pulled"

      # ── AI Triage & Fix MR Creation ──────────────────────
      - name: AI Remediation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OLLAMA_MODEL: "gemma4:e2b"
        run: |
          echo "════════════════════════════════════════════════"
          echo "  AI SECURITY REMEDIATION"
          echo "  Model: ${OLLAMA_MODEL}"
          echo "  $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "════════════════════════════════════════════════"
          echo ""

          # ── Helper: Call AI ──────────────────────────────
          ask_ai() {
            local PROMPT="$1"
            local SYSTEM='You are a senior application security engineer. For each vulnerability:
          1. Determine if it is a TRUE POSITIVE or FALSE POSITIVE by analyzing the code context.
          2. If TRUE POSITIVE, provide the complete corrected file content.
          Respond ONLY with raw JSON (no markdown, no backticks). Format:
          {"is_false_positive": false, "confidence": "HIGH", "reasoning": "Explanation in under 40 words.", "suggested_fix": "What to change in under 25 words.", "fixed_code": "The complete corrected code for the affected function/block, or null if false positive."}'

            RESPONSE=$(curl -sS --max-time 180 \
              -X POST http://localhost:11434/api/chat \
              -H "Content-Type: application/json" \
              -d "$(python3 -c "
          import json,sys
          print(json.dumps({
            'model': '${OLLAMA_MODEL}',
            'messages': [
              {'role':'system','content':sys.argv[1]},
              {'role':'user','content':sys.argv[2]}
            ],
            'stream': False,
            'options': {'temperature':0.2,'top_p':0.7,'num_ctx':8192}
          }))" "$SYSTEM" "$PROMPT")" 2>/dev/null)

            echo "$RESPONSE" | python3 -c "
          import sys,json
          try:
              data=json.load(sys.stdin)
              c=data['message']['content'].strip()
              if c.startswith('\`\`\`'): c=c.split('\n',1)[-1]
              if c.endswith('\`\`\`'): c=c.rsplit('\`\`\`',1)[0]
              print(c.strip())
          except: pass" 2>/dev/null
          }

          parse_field() {
            echo "$1" | python3 -c "import sys,json; print(json.load(sys.stdin).get('$2',''))" 2>/dev/null
          }

          # ── Check for scan results ──────────────────────
          if [ ! -f semgrep-results.json ] || [ ! -s semgrep-results.json ]; then
            echo "▸ No Semgrep results found — skipping"
            exit 0
          fi

          # ── Extract CRITICAL/HIGH findings ──────────────
          python3 << 'PYEOF'
          import json, os

          os.makedirs('/tmp/findings', exist_ok=True)

          with open('semgrep-results.json') as f:
              data = json.load(f)

          results = data.get('results', [])
          count = 0

          for r in results:
              severity = r.get('extra', {}).get('severity', '').upper()
              if severity not in ('ERROR', 'WARNING'):  # Semgrep uses ERROR=Critical, WARNING=High
                  continue

              file_path = r.get('path', '')
              start_line = r.get('start', {}).get('line', 0)
              end_line = r.get('end', {}).get('line', 0)
              check_id = r.get('check_id', '')
              message = r.get('extra', {}).get('message', '')
              lines = r.get('extra', {}).get('lines', '')

              # Read full file for context
              full_file = ''
              try:
                  with open(file_path) as ff:
                      full_file = ff.read()
              except:
                  pass

              with open(f'/tmp/findings/finding_{count}.txt', 'w') as out:
                  out.write(f"""Rule: {check_id}
          Severity: {severity}
          File: {file_path}
          Lines: {start_line}-{end_line}
          Message: {message}

          Vulnerable Code:
          {lines}

          Full File Content:
          {full_file}""")

              with open(f'/tmp/findings/finding_{count}.meta', 'w') as meta:
                  json.dump({
                      'file': file_path,
                      'start_line': start_line,
                      'end_line': end_line,
                      'severity': severity,
                      'check_id': check_id,
                      'message': message
                  }, meta)

              count += 1

          print(count)
          PYEOF

          FINDING_COUNT=$(python3 -c "
          import json
          with open('semgrep-results.json') as f:
              data = json.load(f)
          print(len([r for r in data.get('results', []) if r.get('extra',{}).get('severity','').upper() in ('ERROR','WARNING')]))
          ")

          echo "▸ Found ${FINDING_COUNT} CRITICAL/HIGH findings"

          if [ "$FINDING_COUNT" = "0" ]; then
            echo "✔ No critical/high findings — nothing to remediate"
            exit 0
          fi

          # ── Process each finding ────────────────────────
          TOTAL=0; TRUE_POS=0; FALSE_POS=0; FAILED=0; FIX_BRANCHES=""

          for FINDING_FILE in /tmp/findings/finding_*.txt; do
            [ -f "$FINDING_FILE" ] || continue
            IDX=$(basename "$FINDING_FILE" .txt | sed 's/finding_//')
            META_FILE="/tmp/findings/finding_${IDX}.meta"

            PROMPT=$(cat "$FINDING_FILE")
            RULE=$(head -1 "$FINDING_FILE" | sed 's/Rule: //')
            FILE_PATH=$(grep "^File:" "$FINDING_FILE" | sed 's/File: //')
            SEVERITY=$(grep "^Severity:" "$FINDING_FILE" | sed 's/Severity: //')

            TOTAL=$((TOTAL + 1))
            echo ""
            echo "  [${TOTAL}/${FINDING_COUNT}] ${SEVERITY} — ${RULE}"
            echo "       File: ${FILE_PATH}"

            AI_RESULT=$(ask_ai "$PROMPT")

            if [ -z "$AI_RESULT" ]; then
              echo "       ✘ AI analysis failed"
              FAILED=$((FAILED + 1))
              continue
            fi

            IS_FP=$(parse_field "$AI_RESULT" "is_false_positive")
            CONFIDENCE=$(parse_field "$AI_RESULT" "confidence")
            REASONING=$(parse_field "$AI_RESULT" "reasoning")
            FIX=$(parse_field "$AI_RESULT" "suggested_fix")
            CODE=$(parse_field "$AI_RESULT" "fixed_code")

            if [ "$IS_FP" = "True" ]; then
              FALSE_POS=$((FALSE_POS + 1))
              echo "       🟢 FALSE POSITIVE (${CONFIDENCE})"
              echo "       ${REASONING}"

              # Post as PR comment if this is a pull request
              if [ -n "${{ github.event.pull_request.number }}" ]; then
                COMMENT_BODY="🟢 **AI Security Triage — False Positive**

          | | |
          |---|---|
          | **Rule** | \`${RULE}\` |
          | **File** | \`${FILE_PATH}\` |
          | **Confidence** | ${CONFIDENCE} |

          **Reasoning:** ${REASONING}

          ---
          _🤖 ${OLLAMA_MODEL} | Automated triage_"

                curl -sS -X POST \
                  -H "Authorization: token ${GITHUB_TOKEN}" \
                  -H "Accept: application/vnd.github.v3+json" \
                  "https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
                  -d "$(python3 -c "import json,sys; print(json.dumps({'body': sys.argv[1]}))" "$COMMENT_BODY")" > /dev/null 2>&1
              fi

            else
              TRUE_POS=$((TRUE_POS + 1))
              echo "       🔴 TRUE POSITIVE — creating fix"
              echo "       ${REASONING}"
              [ -n "$FIX" ] && [ "$FIX" != "None" ] && echo "       Fix: ${FIX}"

              # ── Create fix branch and commit ────────────
              if [ -n "$CODE" ] && [ "$CODE" != "None" ] && [ "$CODE" != "null" ]; then
                BRANCH_NAME="fix/sast-$(echo "${RULE}" | sed 's/[^a-zA-Z0-9]/-/g' | tr '[:upper:]' '[:lower:]')-${IDX}"

                echo "       Branch: ${BRANCH_NAME}"

                # Configure git
                git config user.name "AI Security Bot"
                git config user.email "security-bot@automated.fix"

                # Create fix branch
                git checkout -b "$BRANCH_NAME" 2>/dev/null || git checkout "$BRANCH_NAME" 2>/dev/null

                # Write the fixed code
                # AI returns the fixed function/block — we need to write it
                python3 -c "
          import json, sys

          with open('$META_FILE') as f:
              meta = json.load(f)

          ai_result = json.loads(sys.argv[1])
          fixed_code = ai_result.get('fixed_code', '')

          if fixed_code and fixed_code != 'null':
              # Read original file
              with open(meta['file']) as f:
                  lines = f.readlines()

              # Replace affected lines
              start = meta['start_line'] - 1
              end = meta['end_line']

              # Write fixed code
              new_lines = lines[:start] + [fixed_code + '\n'] + lines[end:]

              with open(meta['file'], 'w') as f:
                  f.writelines(new_lines)

              print(f'Fixed {meta[\"file\"]} lines {meta[\"start_line\"]}-{meta[\"end_line\"]}')
          " "$AI_RESULT" 2>/dev/null

                # Check if there are actual changes
                if git diff --quiet; then
                  echo "       ⚠ No changes detected — skipping"
                  git checkout main 2>/dev/null || git checkout - 2>/dev/null
                else
                  git add "$FILE_PATH"
                  git commit -m "fix: resolve ${RULE} in ${FILE_PATH}

          Severity: ${SEVERITY}
          Reasoning: ${REASONING}
          Suggested Fix: ${FIX}

          Auto-generated by AI Security Remediation (${OLLAMA_MODEL})
          Verify before merging." 2>/dev/null

                  # Push the fix branch
                  git push origin "$BRANCH_NAME" --force 2>/dev/null

                  # Create Pull Request via GitHub API
                  PR_BODY="🔴 **AI Security Fix** — ${RULE}

          | | |
          |---|---|
          | **Severity** | ${SEVERITY} |
          | **File** | \`${FILE_PATH}\` |
          | **Confidence** | ${CONFIDENCE} |

          **What was found:** ${REASONING}

          **What was changed:** ${FIX}

          ---
          ⚠️ **Review this fix carefully before merging.**
          _🤖 Auto-generated by ${OLLAMA_MODEL}_"

                  PR_RESPONSE=$(curl -sS -X POST \
                    -H "Authorization: token ${GITHUB_TOKEN}" \
                    -H "Accept: application/vnd.github.v3+json" \
                    "https://api.github.com/repos/${{ github.repository }}/pulls" \
                    -d "$(python3 -c "
          import json,sys
          print(json.dumps({
            'title': f'🔒 Security Fix: {sys.argv[1]} in {sys.argv[2]}',
            'body': sys.argv[3],
            'head': sys.argv[4],
            'base': 'main'
          }))" "$RULE" "$FILE_PATH" "$PR_BODY" "$BRANCH_NAME")" 2>/dev/null)

                  PR_URL=$(echo "$PR_RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('html_url',''))" 2>/dev/null)

                  if [ -n "$PR_URL" ] && [ "$PR_URL" != "None" ]; then
                    echo "       ✔ PR created: ${PR_URL}"
                    FIX_BRANCHES="${FIX_BRANCHES}\n  - ${PR_URL}"
                  else
                    echo "       ⚠ PR creation failed"
                  fi

                  # Go back to main for next finding
                  git checkout main 2>/dev/null || git checkout - 2>/dev/null
                fi
              else
                echo "       ⚠ No fixed code returned by AI"
              fi
            fi
          done

          # ── Summary ─────────────────────────────────────
          echo ""
          echo "════════════════════════════════════════════════"
          echo "  AI REMEDIATION SUMMARY"
          echo "════════════════════════════════════════════════"
          echo "  Total processed:  ${TOTAL}"
          echo "  True positives:   ${TRUE_POS} (fix PRs created)"
          echo "  False positives:  ${FALSE_POS} (flagged)"
          echo "  AI failures:      ${FAILED}"
          echo "  Model:            ${OLLAMA_MODEL}"
          if [ -n "$FIX_BRANCHES" ]; then
            echo ""
            echo "  Fix PRs:"
            echo -e "$FIX_BRANCHES"
          fi
          echo "════════════════════════════════════════════════"
